<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Municipal QR Attendance Management System</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="icon" href="assets/logos/favicon.svg" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/logos/municipal-seal.png" alt="Municipal Seal" class="login-seal" width="120" height="120" fetchpriority="high" decoding="async">
      <img src="assets/logos/system-logo.svg" alt="System Logo" class="login-logo">
      <h1 data-system-name>Municipal QR Attendance Management System</h1>
      <p data-municipality-name>Municipality of Asuncion, Davao del Norte</p>
    </div>

    <div id="login-error" class="login-error mb-3"></div>

    <div id="api-config-notice" class="login-api-notice mb-3">
      <i class="bi bi-link-45deg me-1"></i>
      Connect your Google Apps Script Web App URL below before signing in.
    </div>

    <form id="login-form" class="login-form">
      <div class="mb-3">
        <label for="api-url" class="form-label">Google Apps Script Web App URL</label>
        <input type="url" class="form-control" id="api-url"
               placeholder="https://script.google.com/macros/s/.../exec">
        <small class="login-field-hint">Deploy <code>backend/Code.gs</code> as a Web App, then paste the URL here.</small>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="admin@asuncion.gov" required autocomplete="email">
      </div>

      <div class="mb-3 position-relative">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Enter your password" required autocomplete="current-password">
        <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember-me">
          <label class="form-check-label" for="remember-me">Remember Me</label>
        </div>
        <a href="#" class="forgot-link" id="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-login" id="login-btn">
        <span id="login-btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Login</span>
        <span id="login-btn-loading" style="display:none;">
          <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
        </span>
      </button>
    </form>

    <div id="login-loading" class="login-loading">
      <div class="spinner-border text-light" role="status"></div>
      <p class="mt-3 mb-0">Authenticating...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isAuthenticated()) {
        window.location.href = 'pages/dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('login-error');
      const apiNotice = document.getElementById('api-config-notice');
      const apiUrlInput = document.getElementById('api-url');
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');

      const savedUrl = API.getBaseUrl();
      if (savedUrl && !savedUrl.includes('YOUR_GOOGLE')) {
        apiUrlInput.value = savedUrl;
        apiNotice.style.display = 'none';
      }

      apiUrlInput.addEventListener('change', () => {
        const url = apiUrlInput.value.trim();
        if (url) {
          API.setBaseUrl(url);
          API_CONFIG.BASE_URL = url;
          apiNotice.style.display = 'none';
          errorEl.style.display = 'none';
        }
      });

      function ensureApiUrl() {
        const url = apiUrlInput.value.trim();
        if (!url) {
          errorEl.textContent = 'Please enter your Google Apps Script Web App URL.';
          errorEl.style.display = 'block';
          apiUrlInput.focus();
          return false;
        }
        if (!url.includes('script.google.com')) {
          errorEl.textContent = 'URL must be a Google Apps Script Web App URL (script.google.com/.../exec).';
          errorEl.style.display = 'block';
          return false;
        }
        API.setBaseUrl(url);
        API_CONFIG.BASE_URL = url;
        apiNotice.style.display = 'none';
        return true;
      }

      if (API.isConfigured()) {
        App.loadSettings();
      }

      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
      });

      document.getElementById('forgot-password').addEventListener('click', e => {
        e.preventDefault();
        App.showToast('Please contact your system administrator to reset your password.', 'info');
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        errorEl.style.display = 'none';

        if (!ensureApiUrl()) return;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember-me').checked;
        const loginBtn = document.getElementById('login-btn');

        loginBtn.disabled = true;
        document.getElementById('login-btn-text').style.display = 'none';
        document.getElementById('login-btn-loading').style.display = 'inline';

        try {
          const result = await Auth.login(email, password, remember);
          if (result.success) {
            App.showToast('Login successful! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'pages/dashboard.html'; }, 800);
          } else {
            errorEl.textContent = result.message || 'Invalid credentials.';
            errorEl.style.display = 'block';
          }
        } catch (err) {
          errorEl.textContent = err.message || 'Connection failed. Check API URL configuration.';
          errorEl.style.display = 'block';
        } finally {
          loginBtn.disabled = false;
          document.getElementById('login-btn-text').style.display = 'inline';
          document.getElementById('login-btn-loading').style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
