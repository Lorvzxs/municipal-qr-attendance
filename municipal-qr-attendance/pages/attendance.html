<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Records - Municipal QR Attendance</title>
  <link rel="icon" href="../assets/logos/favicon.svg" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/municipal-seal.png" alt="Seal">
        <h2 data-system-name>Municipal QR Attendance</h2>
        <small data-municipality-name>Asuncion, Davao del Norte</small>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="scanner.html" class="nav-link"><i class="bi bi-qr-code-scan"></i> QR Scanner</a>
        <a href="attendance.html" class="nav-link"><i class="bi bi-calendar-check"></i> Attendance</a>
        <a href="reports.html" class="nav-link"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
        <a href="settings.html" class="nav-link"><i class="bi bi-gear"></i> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <img id="sidebar-avatar" src="../assets/profiles/default-avatar.svg" alt="User">
          <div class="sidebar-user-info">
            <strong id="sidebar-user-name">User</strong>
            <small id="sidebar-user-role">Role</small>
          </div>
        </div>
        <a href="#" class="nav-link" id="logout-btn"><i class="bi bi-box-arrow-left"></i> Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-custom d-lg-none" id="sidebar-toggle"><i class="bi bi-list"></i></button>
          <h1><i class="bi bi-calendar-check me-2"></i>Attendance Records</h1>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-custom btn-sm" id="btn-export-excel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
          <button class="btn btn-outline-custom btn-sm" id="btn-export-pdf"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
          <button class="btn btn-primary-custom btn-sm" id="btn-print"><i class="bi bi-printer"></i> Print</button>
        </div>
      </header>

      <div class="page-content">
        <div class="glass-card">
          <div class="filter-bar">
            <div>
              <label class="form-label small">View</label>
              <select id="view-type" class="form-select">
                <option value="daily">Daily Attendance</option>
                <option value="monthly">Monthly Attendance</option>
              </select>
            </div>
            <div id="filter-date-group">
              <label class="form-label small">Date</label>
              <input type="date" id="filter-date" class="form-control">
            </div>
            <div id="filter-month-group" style="display:none;">
              <label class="form-label small">Month</label>
              <input type="month" id="filter-month" class="form-control">
            </div>
            <div>
              <label class="form-label small">Office</label>
              <select id="filter-office" class="form-select">
                <option value="all">All Offices</option>
              </select>
            </div>
            <div>
              <label class="form-label small">Search Employee</label>
              <input type="text" id="filter-search" class="form-control" placeholder="Name or office...">
            </div>
            <div>
              <label class="form-label small">&nbsp;</label>
              <button class="btn btn-primary-custom d-block" id="btn-filter"><i class="bi bi-search"></i> Search</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table data-table mb-0">
              <thead>
                <tr>
                  <th>Office</th><th>Employee Name</th><th>Date</th>
                  <th>AM IN</th><th>AM OUT</th><th>PM IN</th><th>PM OUT</th>
                  <th>Hours</th><th>Status</th>
                </tr>
              </thead>
              <tbody id="attendance-table-body">
                <tr><td colspan="9" class="text-center text-muted py-4">No records found.</td></tr>
              </tbody>
            </table>
          </div>
          <div class="mt-3 text-muted small" id="record-count">Showing 0 records</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/attendance.js"></script>
</body>
</html>
