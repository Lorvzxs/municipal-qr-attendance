<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner - Municipal QR Attendance</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="icon" href="../assets/logos/favicon.svg" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/municipal-seal.png" alt="Seal" width="80" height="80" loading="lazy" decoding="async">
        <h2 data-system-name>Municipal QR Attendance</h2>
        <small data-municipality-name>Asuncion, Davao del Norte</small>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="scanner.html" class="nav-link"><i class="bi bi-qr-code-scan"></i> QR Scanner</a>
        <a href="attendance.html" class="nav-link"><i class="bi bi-calendar-check"></i> Attendance</a>
        <a href="reports.html" class="nav-link"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
        <a href="settings.html" class="nav-link"><i class="bi bi-gear"></i> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <img id="sidebar-avatar" src="../assets/profiles/default-avatar.svg" alt="User">
          <div class="sidebar-user-info">
            <strong id="sidebar-user-name">User</strong>
            <small id="sidebar-user-role">Role</small>
          </div>
        </div>
        <a href="#" class="nav-link" id="logout-btn"><i class="bi bi-box-arrow-left"></i> Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-custom d-lg-none" id="sidebar-toggle"><i class="bi bi-list"></i></button>
          <h1><i class="bi bi-qr-code-scan me-2"></i>QR Scanner</h1>
        </div>
      </header>

      <div class="page-content scanner-bg">
        <div class="scanner-container">
          <div class="glass-card mb-4">
            <div class="mb-3">
              <label for="scan-type" class="form-label fw-semibold">Attendance Type</label>
              <select id="scan-type" class="form-select form-select-lg">
                <option value="AM IN">AM IN</option>
                <option value="AM OUT">AM OUT</option>
                <option value="PM IN">PM IN</option>
                <option value="PM OUT">PM OUT</option>
              </select>
            </div>

            <div id="qr-reader" class="mb-3"></div>

            <div class="scanner-controls">
              <button class="btn btn-primary-custom" id="start-scanner">
                <i class="bi bi-camera-video me-1"></i> Start Scanner
              </button>
              <button class="btn btn-outline-custom" id="stop-scanner" disabled>
                <i class="bi bi-stop-circle me-1"></i> Stop Scanner
              </button>
              <button class="btn btn-outline-custom" id="switch-camera" disabled>
                <i class="bi bi-arrow-repeat me-1"></i> Switch Camera
              </button>
            </div>

            <div class="manual-entry-section">
              <h6 class="fw-semibold mb-3"><i class="bi bi-keyboard me-2"></i>Manual QR Entry</h6>
              <div class="input-group">
                <input type="text" class="form-control" id="manual-qr"
                       placeholder="e.g. HRMO-ESGUERA, LORVY JUN A.">
                <button class="btn btn-primary-custom" id="manual-submit">
                  <i class="bi bi-check-lg"></i> Submit
                </button>
              </div>
              <small class="text-muted">Format: OFFICE-FULLNAME</small>
            </div>
          </div>

          <div class="scan-result-card" id="scan-result">
            <div class="result-icon"><i class="bi bi-check-lg"></i></div>
            <h4 class="text-center text-success mb-3">Attendance Recorded!</h4>
            <div class="scan-result-item">
              <span class="label">Employee Name</span>
              <span class="value" id="result-name">—</span>
            </div>
            <div class="scan-result-item">
              <span class="label">Office</span>
              <span class="value" id="result-office">—</span>
            </div>
            <div class="scan-result-item">
              <span class="label">Date</span>
              <span class="value" id="result-date">—</span>
            </div>
            <div class="scan-result-item">
              <span class="label">Time</span>
              <span class="value" id="result-time">—</span>
            </div>
            <div class="scan-result-item">
              <span class="label">Attendance Type</span>
              <span class="value" id="result-type">—</span>
            </div>
            <div class="scan-result-item">
              <span class="label">Status</span>
              <span class="value" id="result-status">—</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <audio id="success-sound" preload="auto">
    <source src="../assets/sounds/success.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/scanner.js" defer></script>
</body>
</html>
